name: Release Windows

# Pousse un tag « vX.Y.Z » (ex. v0.1.0) : l'installeur Windows est construit puis publié dans une Release GitHub.
# « Run workflow » (manuel) construit seulement l'installeur et le garde comme artefact du run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # pas de signature de code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Compiler l'appli
        run: npx electron-vite build

      - name: Construire l'installeur
        run: npx electron-builder --win --publish never

      - name: Garder l'installeur comme artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: DeskAssistant-Setup
          path: dist/DeskAssistant-Setup-*.exe

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeskAssistant-Setup-*.exe
          generate_release_notes: true
