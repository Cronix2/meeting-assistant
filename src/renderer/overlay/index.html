<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Assistant</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2Z" /></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5-12-7.5Z" /></symbol>
        <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" /></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
          />
        </symbol>
        <symbol id="i-hide" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      </defs>
    </svg>

    <div id="app">
      <header id="bar">
        <div id="state" title="">
          <span id="dot" class="dot"></span>
          <span id="status">Démarrage…</span>
        </div>
        <span id="meter" class="meter" title="Son capté" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="spacer"></span>

        <div id="mode" class="seg" role="group" aria-label="Quand répondre">
          <button type="button" data-mode="manual" title="Répondre seulement quand je le demande">Manuel</button>
          <button type="button" data-mode="auto" title="Répondre tout seul aux questions">Auto</button>
        </div>
        <button type="button" id="ask" class="primary" title="Demander une réponse maintenant">
          <svg><use href="#i-bolt" /></svg><span class="lbl">Répondre</span>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" id="listen" class="icon" title="Mettre l'écoute en pause" aria-label="Pause">
          <svg><use href="#i-pause" /></svg>
        </button>
        <button type="button" id="clear" class="icon" title="Repartir de zéro (efface la conversation)" aria-label="Repartir de zéro">
          <svg><use href="#i-reset" /></svg>
        </button>
        <button type="button" id="settings" class="icon" title="Réglages" aria-label="Réglages">
          <svg><use href="#i-gear" /></svg>
        </button>
        <button type="button" id="close" class="icon" title="Masquer la fenêtre (l'écoute continue)" aria-label="Masquer">
          <svg><use href="#i-hide" /></svg>
        </button>
      </header>
      <main id="answer"></main>
      <footer id="foot">
        <div id="live"></div>
        <span id="perf" title="Délai avant le premier mot de la réponse"></span>
      </footer>
    </div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
